name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - website/**
      - .github/workflows/deploy.yml

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Both workflows write to pages, so serialize their jobs.
    concurrency:
      group: publish-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: website

      - name: Test website data loading
        run: bun test
        working-directory: website

      - name: Build
        env:
          VITE_SHOW_EXTENSIONS_WITHOUT_REGISTRY: ${{ vars.VITE_SHOW_EXTENSIONS_WITHOUT_REGISTRY || 'true' }}
          VITE_GISCUS_REPO: ${{ vars.VITE_GISCUS_REPO }}
          VITE_GISCUS_REPO_ID: ${{ vars.VITE_GISCUS_REPO_ID }}
          VITE_GISCUS_CATEGORY: ${{ vars.VITE_GISCUS_CATEGORY }}
          VITE_GISCUS_CATEGORY_ID: ${{ vars.VITE_GISCUS_CATEGORY_ID }}
        run: bun run build --base "/${GITHUB_REPOSITORY#*/}/"
        working-directory: website

      - name: Publish website
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: ./website/dist
          # Retain the aggregated manifests managed by the update workflow.
          keep_files: true
