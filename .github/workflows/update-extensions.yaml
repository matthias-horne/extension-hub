name: Update extension information

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - extensions/**
      - tools/update-extensions/**
      - tools/api-compatibility-indicator/**
      - .github/workflows/update-extensions.yaml

permissions:
  contents: read

concurrency:
  group: update-extension-manifests
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    concurrency:
      group: publish-pages
      cancel-in-progress: false
    steps:
      - name: Check out registry and updater
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: hub
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hub/tools/update-extensions/package-lock.json

      - name: Install dependencies
        working-directory: hub/tools/update-extensions
        run: npm ci

      - name: Test updater
        working-directory: hub/tools/update-extensions
        run: npm test

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: hub/tools/api-compatibility-indicator/go.mod
          cache: false

      # Checks download extension modules and many Gardener API versions at runtime.
      # Save a new cache after every run so these downloads survive even failed updates.
      - name: Restore Go dependencies and build cache
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-extension-api-go-${{ hashFiles('hub/tools/api-compatibility-indicator/go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-extension-api-go-${{ hashFiles('hub/tools/api-compatibility-indicator/go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-extension-api-go-

      - name: Build API compatibility indicator
        working-directory: hub/tools/api-compatibility-indicator
        run: |
          go test ./...
          go build -o "$RUNNER_TEMP/api-compatibility-indicator" .

      - name: Install kubeconform for Helm API checks
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1
        with:
          version: '1.3.0'

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: 'v3.19.0'

      - name: Check out published manifests
        uses: actions/checkout@v6
        with:
          ref: pages
          path: pages

      - name: Update extension resources, Helm values, compatibility, and repository information
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node hub/tools/update-extensions/update-extensions.js
          --extensions-dir hub/extensions --output-dir pages/extensions
          --api-compatibility-indicator "$RUNNER_TEMP/api-compatibility-indicator"

      # Publish successful extensions even if another extension could not update.
      # The update step still fails the job so missing artifacts remain visible.
      - name: Commit and push changes
        if: ${{ !cancelled() && (steps.update.outcome == 'success' || steps.update.outcome == 'failure') }}
        working-directory: pages
        run: |
          git add -- extensions
          if git diff --cached --quiet; then
            echo 'No manifest changes.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update aggregated extension manifests'
            git push origin HEAD:pages
          fi

      - name: Save Go dependencies and build cache
        if: ${{ always() && steps.go-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
