name: Update extension manifests

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - extensions/**

permissions:
  contents: read

concurrency:
  group: update-extension-manifests
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: publish-pages
      cancel-in-progress: false
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Check out registry and updater
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: hub
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hub/tools/update-extensions/package-lock.json

      - name: Install dependencies
        working-directory: hub/tools/update-extensions
        run: npm ci

      - name: Test updater
        working-directory: hub/tools/update-extensions
        run: npm test

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1
        with:
          version: '1.3.0'

      - name: Check out published manifests
        uses: actions/checkout@v6
        with:
          ref: pages
          path: pages

      - name: Update aggregated manifests
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: node hub/tools/update-extensions/update-extensions.js --extensions-dir hub/extensions --output-dir pages/extensions

      # Publish successful extensions even if another extension could not update.
      # The update step still fails the job so missing artifacts remain visible.
      - name: Commit and push changes
        id: publish
        if: ${{ !cancelled() && (steps.update.outcome == 'success' || steps.update.outcome == 'failure') }}
        working-directory: pages
        run: |
          git add -- extensions
          if git diff --cached --quiet; then
            echo 'No manifest changes.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update aggregated extension manifests'
            git push origin HEAD:pages
          fi
          echo 'published=true' >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    # Rebuild even after a partial update failure or a run without changes.
    if: ${{ !cancelled() && needs.update.outputs.published == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
